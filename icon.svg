<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c81"/>
      <stop offset="100%" stop-color="#07223b"/>
    </linearGradient>
    <radialGradient id="puckGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <!-- Background Rounded App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Ice Rink Arena Outline -->
  <rect x="76" y="76" width="360" height="360" rx="90" fill="#ffffff" stroke="#38bdf8" stroke-width="8"/>
  
  <!-- Red Center Line & Blue Line -->
  <line x1="256" y1="76" x2="256" y2="436" stroke="#dc2626" stroke-width="8" stroke-dasharray="16 10"/>
  <circle cx="256" cy="256" r="64" fill="none" stroke="#1d4ed8" stroke-width="6"/>
  <circle cx="256" cy="256" r="8" fill="#1d4ed8"/>
  
  <!-- Goal Net Line Left & Right -->
  <line x1="126" y1="110" x2="126" y2="402" stroke="#dc2626" stroke-width="4"/>
  <line x1="386" y1="110" x2="386" y2="402" stroke="#dc2626" stroke-width="4"/>

  <!-- Hockey Sticks Crossed -->
  <g stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 372 L372 140 L402 155"/>
    <path d="M372 372 L140 140 L110 155"/>
  </g>
  
  <!-- Hockey Puck in Center with Glow -->
  <ellipse cx="256" cy="256" rx="42" ry="30" fill="url(#puckGrad)" stroke="#ffffff" stroke-width="4"/>
  <ellipse cx="256" cy="250" rx="36" ry="14" fill="#475569" opacity="0.6"/>
</svg>
